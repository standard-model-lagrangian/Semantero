# The Python and TypeScript half of `make check`; the Swift suite and the app self-test stay local (they need macOS 26
# and a screen). Runs the same `make ci` target you can run yourself.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      # The oldest Python the project supports, so newer-only syntax is caught.
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      # Node 26.4+ runs the .ts tests natively.
      - uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: |
            obsidian/paper-search/package-lock.json
            launcher-core/package-lock.json

      - name: Install
        run: |
          # pdftotext, for the PDF extraction tests. Update first: the runner image's package lists go stale.
          sudo apt-get update -q
          sudo apt-get install -y -q poppler-utils
          python -m pip install -q -r requirements.txt ruff
          npm ci --prefix obsidian/paper-search
          npm ci --prefix launcher-core

      - name: make ci
        run: make ci PY=python RUFF=ruff
