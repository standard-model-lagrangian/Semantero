vault = "~/Documents/Obsidian Vault"
daily_folder = ""        # daily notes (YYYY-MM-DD.md) live at the vault root
data_dir = ".planner"    # hidden from Obsidian; holds sidecars and thread registry
reviews_folder = "Reviews"
daily_template = "Templates/Daily.md"   # same file Obsidian's Daily Notes uses

[brief]
collapsed = true         # callout starts folded; set false to have it open
slip_window_notes = 6    # "slipping" looks at your last N notes...
slip_min = 3             # ...and flags work that appears in at least this many without progress

[schedule]
day_starts_hour = 4      # opening the laptop before this still counts as the previous day
offline_grace_min = 60   # after this long offline, run anyway with the local model
remind = true
remind_hour = 21

[threads]
file = "Threads.md"
active_days = 14
quiet_days = 60
lines_per_thread = 6

[models]
extract = "groq:openai/gpt-oss-120b"   # nightly; won the Oct 2026 thread comparison
reasoning_effort = "high"              # gpt-oss on Groq: ~9s/note vs ~4s at the default medium
extract_fallback = "ollama:qwen3:8b"   # used if Groq fails; re-extracted with Groq on the next run
weekly = "anthropic:claude-haiku-5-5"
weekly_effort = "high"

ollama_url = "http://localhost:11434"
ollama_think = true      # reasoning on: ~2x slower, much better threads; fine for one note a night
num_ctx = 8192
num_predict = 4096       # token cap per call; stops runaway reasoning
timeout_s = 420

[extract]
thread_window_days = 21  # threads seen this recently are offered for reuse

[search]
zotero_dir = "~/Zotero"
model = "qwen3-embedding:0.6b"      # fixed once chosen by the evaluation; changing it rebuilds everything
dims = 1024                         # Matryoshka-style truncation, then re-normalise
query_instruction = "Given a description of what a paper found or showed, retrieve that paper"
chunk_words = 300
chunk_overlap_words = 50
max_chunks_per_paper = 150          # stops a thesis or book from dominating results
batch_size = 32
keep_alive = "5m"                   # Ollama unloads the model (~400 MB) this long after the last embedding


[notes]
# Off for the Obsidian-only setup. The global setup (notes index + Daito Search app) turns it on in config.local.toml:
#   [notes]
#   enabled = true
#   exclude = [ ...defaults..., "Private/**" ]   # see docs/INSTALL.md
enabled = false
exclude = ["Templates/**", "Threads.md", "Zotero Template.md", "Zotero Citation Template.md"]
chunk_words = 200            # notes are denser than papers; settled by the evaluation
chunk_overlap_words = 40
min_section_words = 25
lead_words = 120
max_chunks_per_note = 60
# model, dims, query_instruction, batch_size, keep_alive come from [search]
