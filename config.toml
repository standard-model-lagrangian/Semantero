vault = "~/Documents/Obsidian Vault"
daily_folder = ""        # daily notes (YYYY-MM-DD.md) live at the vault root; the notes index marks them "daily"
data_dir = ".planner"    # hidden from Obsidian; holds the paper and notes indexes

[search]
zotero_dir = "~/Zotero"
model = "qwen3-embedding:0.6b"      # fixed once chosen by the evaluation; changing it rebuilds everything
dims = 1024                         # Matryoshka-style truncation, then re-normalise
query_instruction = "Given a description of what a paper found or showed, retrieve that paper"
chunk_words = 300
chunk_overlap_words = 50
max_chunks_per_paper = 150          # stops a thesis or book from dominating results
batch_size = 32
keep_alive = "5m"                   # Ollama unloads the model (~400 MB) this long after the last embedding


[notes]
# Off for the Obsidian-only setup. The global setup (notes index + Semantero app) turns it on in config.local.toml:
#   [notes]
#   enabled = true
#   exclude = [ ...defaults..., "Private/**" ]   # see docs/INSTALL.md
enabled = false
exclude = ["Templates/**", "Threads.md", "Zotero Template.md", "Zotero Citation Template.md"]
chunk_words = 200            # notes are denser than papers; settled by the evaluation
chunk_overlap_words = 40
min_section_words = 25
lead_words = 120
max_chunks_per_note = 60
# model, dims, query_instruction, batch_size, keep_alive come from [search]
