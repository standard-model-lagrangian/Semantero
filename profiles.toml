# Embedding profiles: one paper + notes index per embedding model, to try them in the real plugin and app.
#   planner profile list             which exist, which is live, sizes and ages
#   planner profile build NAME       build (or update) NAME's index without touching the live one
#   planner profile use NAME         make NAME the live index (folder swap, no re-embedding), then catch it up
# Each entry overrides [search] while it is live. Details and the reasoning behind each choice: docs/EMBED_INSTALLS.md.
#
# Quantisation: the 0.6B models run at Q8_0, as does the 4B; the 8B runs at Ollama's default Q4_K_M (8.1 GB at Q8_0
# would crowd a 16 GB machine while Obsidian and the app are open).
# Dimensions: each Qwen profile stores its full width. Qwen3-Embedding is Matryoshka-trained, so the first 1024 values
# of a stored vector, re-normalised, are what a 1024-dim index would hold: a smaller variant can be derived later
# without re-embedding. pplx stores 128 per token (its native width) plus a 128-dim mean per row (see planner/pplx.py).

["qwen3-0.6b"]
label = "Qwen3-Embedding 0.6B (current)"
backend = "ollama"
model = "qwen3-embedding:0.6b"           # Q8_0, 639 MB
dims = 1024                              # native width

["qwen3-4b"]
label = "Qwen3-Embedding 4B"
backend = "ollama"
model = "qwen3-embedding:4b-q8_0"        # Q8_0, ~4.4 GB
dims = 2560                              # native width

["qwen3-8b"]
label = "Qwen3-Embedding 8B"
backend = "ollama"
model = "qwen3-embedding:8b"             # Q4_K_M, 4.7 GB
dims = 4096                              # native width

["pplx-v2-late"]
label = "pplx-embed-v2-late 0.6B (late interaction)"
backend = "pplx"
model = "pplx-embed-v2-late-0.6b@7bba8e7"   # frozen GGUF (Q8_0) on a pinned llama.cpp; see pplx/README.md
dims = 128                                   # per token; MaxSim scoring
pplx_url = "http://127.0.0.1:11435"          # planner pplxd (launchd: com.planner.pplxd)
